[package]
name = "rigtop-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Native GUI system monitor for workstations, laptops and NAS, a btop alternative: resizable panels, storage health, per-process GPU usage and many hosts over SSH"
readme = "../../README.md"
keywords = ["monitor", "gui", "btop", "egui", "gpu"]
categories = ["gui", "os"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37.0", features = ["persistence"] }
egui = "0.37"
egui_extras = "0.37.0"
egui_tiles = { version = "0.18.0", features = ["serde"] }
rigtop-core = { version = "0.23.0", path = "../rigtop-core" }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot"] }
tempfile = "3.27.0"
toml = "1.1.8"

# Not on Windows: there notify-rust shows toasts under PowerShell's app id,
# which got the unsigned executable quarantined by Microsoft Defender.
[target."cfg(not(windows))".dependencies]
notify-rust = "4.18.2"

# The executable's icon (build.rs); build dependencies follow the host, so
# cross-checking from Linux skips it.
[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
