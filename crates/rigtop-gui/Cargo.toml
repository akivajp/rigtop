[package]
name = "rigtop-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "btop-inspired native GUI system monitor (egui) with resizable panels, storage health and per-process GPU usage"
readme = "../../README.md"
keywords = ["monitor", "gui", "egui", "system", "gpu"]
categories = ["gui", "os"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37.0", features = ["persistence"] }
notify-rust = "4.18.2"
egui = "0.37"
egui_extras = "0.37.0"
egui_tiles = { version = "0.18.0", features = ["serde"] }
rigtop-core = { version = "0.6.0", path = "../rigtop-core" }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot"] }
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
