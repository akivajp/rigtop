[package]
name = "rigtop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "btop-inspired terminal system monitor with storage health (SMART, btrfs RAID, mdadm), per-process GPU usage and power draw"
readme = "../../README.md"
keywords = ["monitor", "tui", "btop", "system", "gpu"]
categories = ["command-line-utilities", "os"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
rigtop-core = { version = "0.5.1", path = "../rigtop-core" }
serde_json = "1.0.154"
