name: Release

# Pushing a tag such as v0.1.0 builds the binaries, publishes a GitHub
# Release with notes from CHANGELOG.md, and publishes the crates to
# crates.io (trusted publishing: no stored token).
#
# Running the workflow by hand only builds the archives (uploaded as
# artifacts) to check packaging, unless `crates_tag` is given: then it only
# publishes that existing tag to crates.io (e.g. one released before
# crates.io publishing was automated, or after a failed publish).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      crates_tag:
        description: "Publish this existing tag (e.g. v0.2.0) to crates.io instead of building"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    if: inputs.crates_tag == ''

    strategy:
      fail-fast: false
      matrix:
        include:
          # Older Ubuntu so that the glibc requirement stays low (2.35).
          # Static musl builds are avoided: they cannot dlopen NVML.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            packages: -p rigtop -p rigtop-gui
            bins: rigtop rigtop-gui
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            packages: -p rigtop
            bins: rigtop
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            packages: -p rigtop -p rigtop-gui
            bins: rigtop.exe rigtop-gui.exe
          - target: aarch64-apple-darwin
            os: macos-latest
            packages: -p rigtop -p rigtop-gui
            bins: rigtop rigtop-gui
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.packages }}
      - name: Install cargo-deb
        if: runner.os == 'Linux'
        run: cargo install cargo-deb --locked
      - name: Package
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          name="rigtop-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          for bin in ${{ matrix.bins }}; do
            cp "target/${{ matrix.target }}/release/$bin" "dist/$name/"
          done
          cp README.md README.ja.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          if [[ "${{ matrix.target }}" == *linux* ]]; then
            # Optional root collector for SMART and btrfs scrub results.
            cp -r contrib "dist/$name/"
          fi
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
          cd ..
          if [[ "${{ matrix.target }}" == *linux* ]]; then
            # Debian package; the aarch64 build has no GUI.
            variant=""
            if [[ "${{ matrix.target }}" == aarch64* ]]; then
              variant="--variant tui"
            fi
            cargo deb -p rigtop --no-build --target ${{ matrix.target }} $variant --output dist/
          fi
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: rigtop-${{ matrix.target }}
          path: dist/*
          retention-days: 30
      # The MSIX package for the Microsoft Store (the store job below puts it
      # in a draft submission), and a copy signed with a throwaway certificate for trying
      # it on a test PC. Not part of the GitHub release: an unsigned package
      # cannot be installed. The identity comes from the repository's
      # variables (Partner Center > Product identity).
      - name: MSIX package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' |
            Select-Object -First 1).Matches.Groups[1].Value
          $params = @{ BinDir = "target/${{ matrix.target }}/release"; Version = $version; OutDir = "msix"; TestSign = $true }
          if ($env:MSIX_IDENTITY_NAME) { $params.IdentityName = $env:MSIX_IDENTITY_NAME }
          if ($env:MSIX_PUBLISHER) { $params.Publisher = $env:MSIX_PUBLISHER }
          if ($env:MSIX_PUBLISHER_DISPLAY_NAME) { $params.PublisherDisplayName = $env:MSIX_PUBLISHER_DISPLAY_NAME }
          ./packaging/msix/build.ps1 @params
          Get-ChildItem msix
      # The checks Partner Center runs on a submission, run here first
      # (installs the test copy). The report is kept with the package.
      - name: Windows App Certification Kit
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $appcert = "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe"
          if (-not (Test-Path $appcert)) { Write-Host "the App Certification Kit is not installed"; exit 0 }
          $cer = Get-ChildItem msix/*-test.cer | Select-Object -First 1
          $test = Get-ChildItem msix/*-test.msix | Select-Object -First 1
          Import-Certificate -FilePath $cer.FullName -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          & $appcert reset
          & $appcert test -appxpackagepath $test.FullName -reportoutputpath "$PWD\msix\wack-report.xml"
          Write-Host "appcert exit code: $LASTEXITCODE"
          if (Test-Path msix/wack-report.xml) {
            [xml] $report = Get-Content -Raw msix/wack-report.xml
            Write-Host "Overall: $($report.REPORT.OVERALL_RESULT)"
            $report.SelectNodes("//TEST[RESULT!='PASS']") | ForEach-Object {
              Write-Host "$($_.RESULT): $($_.NAME)"
            }
          }
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: store-msix
          path: msix/*
          retention-days: 30

  # A new Microsoft Store submission with this version's MSIX package and
  # the listing files (packaging/msix/store), through akivajp/msstore-submit
  # (GitHub OIDC; the environment `msstore` is what Entra ID trusts). Left
  # as a draft: its log shows what changes, and the Microsoft Store
  # workflow's commit command submits it (Partner Center shows the changes
  # only once committed; don't edit or submit it there). Tags only.
  store:
    name: Microsoft Store submission
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    uses: akivajp/msstore-submit/.github/workflows/store.yml@main
    with:
      app-id: 9N6JMV1QNDCK
      command: submit
      artifact: store-msix
      # The Store's package, not the test copy (-x64-test.msix).
      package: rigtop-v*-x64.msix
      listings: packaging/msix/store
      commit: false

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the crate version
        run: |
          crate_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "v$crate_version" != "$GITHUB_REF_NAME" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: dist
          # The archives only (the MSIX package, store-msix, is for Partner Center).
          pattern: rigtop-*
          merge-multiple: true
      - name: Add the install script
        # Served at releases/latest/download/install.sh for the one-liner.
        run: cp install.sh dist/
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section of this version, without its heading.
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          # Download pages must point at the code signing policy (SignPath).
          printf '\n[Code signing policy](%s/%s#code-signing-policy)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >> notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "rigtop $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag

  winget:
    name: Update the winget package
    needs: release
    runs-on: ubuntu-latest
    # Opens the update pull request on microsoft/winget-pkgs from the
    # akivajp/winget-pkgs fork. Needs the WINGET_TOKEN secret (a classic
    # token with public_repo and workflow) and akivajp.rigtop already in
    # winget-pkgs; skipped without the token, and never fails the release.
    continue-on-error: true
    steps:
      - name: Check for the token
        id: token
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [[ -n "$WINGET_TOKEN" ]]; then present=true; else present=false; fi
          echo "present=$present" >> "$GITHUB_OUTPUT"
      # Pinned to a commit of main (2026-10-07): the token can open pull
      # requests in your name.
      - uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54
        if: steps.token.outputs.present == 'true'
        with:
          identifier: akivajp.rigtop
          installers-regex: 'windows-msvc\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}

  crates:
    name: Publish to crates.io
    # Independent of the binary builds: `cargo publish` verifies that every
    # crate builds from its packaged sources.
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.crates_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to request the OIDC token for crates.io trusted publishing.
      id-token: write
    env:
      TAG: ${{ inputs.crates_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Check that the tag matches the crate version
        run: |
          crate_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "v$crate_version" != "$TAG" ]]; then
            echo "tag $TAG does not match Cargo.toml version $crate_version" >&2
            exit 1
          fi
      - name: Get a temporary crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish rigtop-core, rigtop and rigtop-gui
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
