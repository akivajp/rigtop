[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.10.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/akivajp/rigtop"
homepage = "https://github.com/akivajp/rigtop"
authors = ["Akiva Miura"]
# Rust version the crates are checked with (edition 2024 needs 1.85; egui 0.37 needs 1.95).
rust-version = "1.95"
