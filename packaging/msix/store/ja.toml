# rigtop's Microsoft Store listing in Japanese, applied by the
# Microsoft Store workflow (.github/workflows/msstore.yml, akivajp/msstore-submit).
# Fields left out keep the values of the last submission.

title = "rigtop"
short_description = "この PC と管理中の他マシンをまとめて監視。CPU・全 GPU・メモリ・ドライブ・ネットワーク・プロセスに加え、ドライブの健康状態や RAID、SSH 経由の複数ホストまで 1 画面で確認できます。"
# No URLs here (Partner Center's advice); the first paragraph discloses the
# optional dependency on LibreHardwareMonitor (Store policy 10.2.4).
description = '''
Windows では、温度・ファン・CPU の電力は、別でインストールして動かす無料ソフト LibreHardwareMonitor から読み取ります。無くてもそれ以外の項目はすべて表示できます。

rigtop は、この PC と、管理しているワークステーション・ノート PC・自宅サーバー・NAS の状態を並べて表示します。コアごとの CPU 負荷、すべての GPU、メモリ、ドライブ、ネットワーク、プロセスに加えて、一般的なモニターでは見られないドライブの健康状態と RAID も監視します。

この PC では:
• コアごとの CPU 負荷とクロック。温度・ファン・電力は LibreHardwareMonitor から取得
• NVIDIA の GPU: 負荷・ビデオメモリ・温度・電力と、プロセスごとの GPU 使用率とビデオメモリ
• メモリ、ドライブの読み書きと健康状態（摩耗・予備領域・温度）、ネットワークのリンク速度とアドレス
• プロセスの検索・ツリー表示・詳細・タスクの終了・強制終了

SSH でほかのマシンも:
• rigtop をインストールした Linux・macOS・Windows のホストを追加できます。Windows 標準の OpenSSH クライアントと手元の SSH 鍵で、接続先の rigtop を起動します。常駐サーバーも、ポート開放も不要です。
• ホストごとのカードを並べたオーバービュー。注意が必要なホストを先頭に並べ替えることもできます
• Linux ホストからは: SMART、mdadm の RAID と再構築の進捗、ZFS のプールとスクラブ、btrfs のエラー、プロセスごとのコンテナや仮想マシン、AMD・Intel の GPU、Network UPS Tools 経由の UPS
• 指示したときだけ、遠隔ホストの rigtop を手元と同じバージョンへ更新します（接続先ホストが公式リリースをダウンロードします）

ドライブの故障の兆候、RAID の縮退、空き容量の少ないディスク、CPU・GPU・ドライブの高温、メモリ不足を警告し、履歴も残します。1 時間・1 日・解消までスヌーズでき、しきい値はホストごとに設定できます。

そのほか、パネルのサイズ・配置・表示のカスタマイズ、1 分〜24 時間のグラフ、拡大・縮小、任意コマンドの出力を表示するウィジェット、端末版「rigtop」にも対応しています。

利用状況のデータは外部に送信しません。アプリの UI は英語です。無料のオープンソースです（MIT または Apache 2.0）。'''
